# ── 内存配置（按本机实际容量定制）──
# 本机实测：物理内存仅 2.0GB，可用内存常低于 100MB。
# 曾因 Gradle 4G + Metaspace 1G + Kotlin daemon 2G（三 JVM 之和）导致崩溃：
#   "There is insufficient memory for the JVM to continue.
#    Native memory allocation (mmap) failed to map 566231040 bytes"
# 现改为：单 JVM + 进程内编译，堆压到 1024m。
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=true
# 关键：进程内编译，省掉独立的 Kotlin 守护进程（2GB 机器上少一个 JVM 很关键）
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true

# 本工程位于含中文的路径下（...\项目1\Yuki初雪\android-native）。
# Android Gradle Plugin 在 Windows 上默认拒绝非 ASCII 路径并直接 BUILD FAILED。
# 这行是官方给出的绕过开关；已在 Capacitor 工程上验证可用。
# 若后续步骤（aapt / 打包）仍报路径错，应把整个工程移到纯 ASCII 路径。
android.overridePathCheck=true

kotlin.code.style=official
